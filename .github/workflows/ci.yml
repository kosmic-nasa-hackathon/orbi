name: ci

# development is the integration branch; main is release-only.
on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Generated scenarios are deterministic
        run: |
          npm run gen
          git diff --exit-code -- src/data/scenarios

      - run: npm run check
      - run: npm run build
