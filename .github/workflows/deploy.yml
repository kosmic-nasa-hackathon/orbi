name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dokploy:
    if: ${{ vars.DOKPLOY_AUTO_DEPLOY == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: [self-hosted, orbi]
    timeout-minutes: 5
    steps:
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
        run: |
          test -n "$DOKPLOY_TOKEN"
          response=$(curl -sS -w '\n%{http_code}' -X POST \
            "http://192.168.1.115:3000/api/deploy/$DOKPLOY_TOKEN" \
            -H "x-github-event: push" \
            -H "Content-Type: application/json" \
            -d '{"ref":"refs/heads/main"}')
          code=${response##*$'\n'}
          body=${response%$'\n'*}
          echo "$body"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Dokploy rejected the deploy: HTTP $code"
            exit 1
          fi
